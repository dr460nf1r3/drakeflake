name: Set up Nix
description: Install Nix, restore and save the Nix store, and optionally provide the fonts the self-tests render with.

inputs:
  fonts:
    description: Point FONTCONFIG_FILE at DejaVu.
    default: "false"

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          keep-env-derivations = true
          keep-outputs = true
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - if: inputs.fonts == 'true'
      shell: bash
      run: |
        fonts=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#dejavu_fonts)
        mkdir -p "$RUNNER_TEMP/fontconfig"
        printf '<?xml version="1.0"?>\n<fontconfig><dir>%s/share/fonts</dir><cachedir>%s/fontconfig/cache</cachedir></fontconfig>\n' \
          "$fonts" "$RUNNER_TEMP" > "$RUNNER_TEMP/fontconfig/fonts.conf"
        echo "FONTCONFIG_FILE=$RUNNER_TEMP/fontconfig/fonts.conf" >> "$GITHUB_ENV"
