name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix flake check --print-build-logs

  flake-check-macos:
    name: Flake check (macOS)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix flake check --print-build-logs

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Run the tests
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          report=$(nix build --no-link --print-out-paths ".#checks.$system.tests.report")
          cp "$report/junit.xml" junit.xml || true
          status=$(cat "$report/status")
          if [ "$status" != 0 ]; then
            echo "The tests failed (nextest exit $status)." >&2
            exit 1
          fi
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-tests
          path: junit.xml
          if-no-files-found: ignore
      - name: Publish the report
        if: always() && hashFiles('junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit.xml
          fail_on_failure: false

  qml-tests:
    name: QML tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Run the Qt Quick Tests
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          out=$(nix build --no-link --print-out-paths ".#checks.$system.qml-test")
          cp "$out/junit.xml" junit.xml
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qml-tests
          path: junit.xml
          if-no-files-found: ignore
      - name: Publish the report
        if: always() && hashFiles('junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit.xml
          fail_on_failure: false

  selftest:
    name: Self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SELFTEST_ROOT: /tmp/drakeflake-selftest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          fonts: "true"
      - name: Run the suites
        run: |
          package=$(nix build --no-link --print-out-paths .#default)
          export SELFTEST_BINARY="$package/bin/drakeflake"
          export DRAKEFLAKE_FUNCTION_INDEX="$package/share/drakeflake/functions.json"

          status=0
          for suite in plain hm darwin missing; do
            nix shell --inputs-from . nixpkgs#bash nixpkgs#coreutils nixpkgs#gnugrep \
              -c scripts/selftest.sh "$suite" || status=1
          done
          exit "$status"
      - name: Collect screenshots and logs
        if: always()
        run: |
          mkdir -p selftest
          for run in "$SELFTEST_ROOT"/*/; do
            [ -d "$run" ] || continue
            name=$(basename "$run")
            mkdir -p "selftest/$name"
            cp -r "$run/shots" "$run/out.log" "selftest/$name/" || true
          done
          nix shell --inputs-from . nixpkgs#bash nixpkgs#coreutils nixpkgs#gnugrep nixpkgs#gnused \
            -c scripts/selftest-junit.sh "$SELFTEST_ROOT" selftest/junit.xml
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest
          path: selftest/
          if-no-files-found: ignore
      - name: Publish the report
        if: always() && hashFiles('selftest/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: selftest/junit.xml
          fail_on_failure: false

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SELFTEST_ROOT: /tmp/drakeflake-selftest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          fonts: "true"
      - name: Measure
        run: |
          index=$(nix build --no-link --print-out-paths .#function-index)
          export DRAKEFLAKE_FUNCTION_INDEX="$index/functions.json"
          nix shell --inputs-from . nixpkgs#git nixpkgs#curl \
            -c nix develop -c scripts/coverage.sh coverage
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  commitizen:
    name: Commit message
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Check the message
        env:
          COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          nix run nixpkgs#commitizen -- check --message "$subject"

  stable-tag:
    name: Move stable
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flake-check, flake-check-macos, rust-tests, qml-tests, selftest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push the tag
        run: |
          git fetch --force origin "refs/tags/stable:refs/tags/stable" || true
          if git rev-parse -q --verify refs/tags/stable >/dev/null &&
            ! git merge-base --is-ancestor refs/tags/stable "$GITHUB_SHA"; then
            echo "stable is already ahead of $GITHUB_SHA, leaving it."
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/tags/stable" --force
          echo "stable now points at $GITHUB_SHA."

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name != 'stable'
    needs: [flake-check, flake-check-macos, rust-tests, qml-tests, selftest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      - name: Write the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: nix run nixpkgs#commitizen -- changelog "$TAG" --dry-run > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists already."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
