name: Translations

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: translations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Update Qt Linguist files
    # A push made with GITHUB_TOKEN does not start another run, but the guard
    # keeps a manual dispatch on the bot's own commit cheap.
    if: "!startsWith(github.event.head_commit.message, 'chore(i18n)')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Run lupdate
        run: nix shell --inputs-from . nixpkgs#qt6.qttools -c ./i18n/update.sh
      - name: Commit the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n
          if git diff --staged --quiet; then
            echo "No changes to translations detected."
            exit 0
          fi
          git commit -m "chore(i18n): Update Qt Linguist translations"
          git push origin HEAD:main
